name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Publishes the day's Slop post: posts are committed ahead of their date and src/slop.ts hides
  # them until it arrives. 12:00 UTC is 06:00 or 07:00 in Chicago, never earlier. GitHub disables
  # this trigger after 60 days without a commit; re-enable it with `gh workflow enable deploy.yml`.
  schedule:
    - cron: '0 12 * * *'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Without this, setup-node uses whatever Node 22 the runner image has cached, which can lag a
          # dependency's engines floor (a deploy failed on 22.23.3 against >=22.23.4).
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Rendering a Band needs a real browser (docs/adr/0001). Playwright ships no postinstall, so
      # nothing above downloads one and chromium.launch() would fail on every clean runner.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      # Each Band is keyed on a hash of everything that can change its pixels — Sketch and its
      # imports, Harness, render page, pinned p5 build, theme and Seed (scripts/bands.mjs). The
      # hash is conservative, so some edits re-render to identical bytes; what it rules out is
      # shipping an image the current code would no longer produce. Without this the cache is
      # empty every run and every banded post is re-rendered on every push, however unrelated
      # the change.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/bands
          key: bands-${{ runner.os }}-${{ hashFiles('src/bands/**', 'src/theme.ts', 'src/pages/band-render.astro', 'src/content/posts/**') }}
          restore-keys: bands-${{ runner.os }}-
      # The embedding model behind Recommended posts, pinned to one revision in src/similar.ts and
      # keyed on that file so a change of model can't leave the old one cached for good. Without
      # this every run downloads it from Hugging Face, and an outage there fails the build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/transformers
          key: transformers-${{ hashFiles('src/similar.ts') }}
      - run: pnpm run build
      # /rss.xml is emailed to every subscriber within the hour, and Slop must never be. Item links
      # are absolute <link> elements and post bodies are HTML-escaped, so only a Slop item can match.
      - name: Check no Slop in the newsletter feed
        run: "test -s dist/rss.xml && ! grep -q '<link>https://nathanarthur.com/slop/' dist/rss.xml"
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          # Holds wrangler to major 4 (assets-only Worker support needs it), so a new major arrives
          # as a deliberate change rather than with the action's default.
          wranglerVersion: '4'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
