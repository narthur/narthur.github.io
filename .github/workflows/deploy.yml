name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Publishes the day's Slop post: posts are committed ahead of their date and src/slop.ts hides
  # them until it arrives. 12:00 UTC is 06:00 or 07:00 in Chicago, never earlier. GitHub disables
  # this trigger after 60 days without a commit; re-enable it with `gh workflow enable deploy.yml`.
  schedule:
    - cron: '0 12 * * *'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Rendering a Band needs a real browser (docs/adr/0001). Playwright ships no postinstall, so
      # nothing above downloads one and chromium.launch() would fail on every clean runner.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      # Bands are keyed on a hash of everything that can change their pixels — Sketch, registry,
      # Harness, render page, pinned p5 build, theme and Seed. The hash is conservative, so some
      # edits re-render to identical bytes; what it rules out is shipping an image the current
      # code would no longer produce. Without this the cache is empty every run and every banded post is
      # re-rendered on every push, however unrelated the change.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/bands
          key: bands-${{ runner.os }}-${{ hashFiles('src/bands/**', 'src/theme.ts', 'src/pages/band-render.astro', 'src/content/posts/**') }}
          restore-keys: bands-${{ runner.os }}-
      - run: pnpm run build
      # /rss.xml is emailed to every subscriber within the hour, and Slop must never be. Item links
      # are absolute <link> elements and post bodies are HTML-escaped, so only a Slop item can match.
      - name: Check no Slop in the newsletter feed
        run: "test -s dist/rss.xml && ! grep -q '<link>https://nathanarthur.com/slop/' dist/rss.xml"
      - uses: cloudflare/wrangler-action@v3
        with:
          # v3 defaults to wrangler 3.90, which lacks assets-only Worker support
          wranglerVersion: '4'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
