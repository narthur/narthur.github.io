name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Every job here only reads the repo and runs the build/test tooling.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Rendering a Band needs a real browser (docs/adr/0001). Playwright ships no postinstall, so
      # nothing above downloads one and chromium.launch() would fail on every clean runner.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      # Bands are keyed on a hash of everything that can change their pixels — Sketch, registry,
      # Harness, render page, pinned p5 build, theme and Seed. The hash is conservative, so some
      # edits re-render to identical bytes; what it rules out is shipping an image the current
      # code would no longer produce. Without this the cache is empty every run and every banded post is
      # re-rendered on every push, however unrelated the change.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/bands
          key: bands-${{ runner.os }}-${{ hashFiles('src/bands/**', 'src/theme.ts', 'src/pages/band-render.astro', 'src/content/posts/**') }}
          restore-keys: bands-${{ runner.os }}-
      - run: pnpm run build
